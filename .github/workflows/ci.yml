name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest tests -q
      # Guard tests from the incident: a fix must keep guests paying full price and never make orders free.
      - name: Guard tests (pull requests)
        if: github.event_name == 'pull_request' && hashFiles('ci/guards/*.py') != ''
        run: python -m pytest ci/guards -q
